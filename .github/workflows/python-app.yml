name: Python Test and Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create environment file
      run: |
        cat > .env << EOF
        MODEL_NAME=student_grade_predictor
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-${{ github.sha }}
        API_KEY=test-api-key-for-ci-${{ github.sha }}
        TEST_MODE=ci
        EOF

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest flake8 pylint

    - name: Check code style with flake8
      run: |
        echo "=== Running flake8 ==="
        flake8 4-homework2.py --max-line-length=127 --show-source --statistics

    - name: Run static analysis with pylint
      run: |
        echo "=== Running pylint ==="
        pylint 4-homework2.py --exit-zero --score=no

    - name: Run tests with pytest
      run: |
        echo "=== Running pytest ==="
        python -m pytest 4-homework2.py -v --tb=short --cov=.

    - name: Test script execution
      run: |
        echo "=== Testing direct script execution ==="
        python 4-homework2.py
