name: Python Test and Lint

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Create environment file
      run: |
        echo "MODEL_NAME=student_grade_predictor" > .env
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-123" >> .env
        echo "API_KEY=test-api-key-456" >> .env
        echo "TEST_MODE=ci" >> .env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest flake8

    - name: Run basic linting
      run: |
        # 只检查错误，不检查警告
        flake8 4-homework2.py --select=E9,F63,F7,F82 --show-source

    - name: Run pytest tests
      run: |
        python -m pytest 4-homework2.py -v
