name: Python Test and Lint

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Create environment file
      run: |
        echo "MODEL_NAME=student_grade_predictor" > .env
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-123" >> .env
        echo "API_KEY=test-api-key-456" >> .env
        echo "TEST_MODE=ci" >> .env

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest black flake8 isort

    - name: Check code formatting with Black
      run: |
        echo "=== Checking code formatting with Black ==="
        black --check 4-homework2.py || echo "Black formatting issues found"

    - name: Check import sorting with isort
      run: |
        echo "=== Checking import sorting with isort ==="
        isort --check-only 4-homework2.py || echo "Import sorting issues found"

    - name: Run flake8 linting
      run: |
        echo "=== Running flake8 linting ==="
        flake8 4-homework2.py --max-line-length=88 --statistics --exit-zero

    - name: Run pytest tests
      run: |
        echo "=== Running pytest tests ==="
        python -m pytest 4-homework2.py -v
